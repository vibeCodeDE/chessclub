{% load static %}<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ club_name }}{% endblock %}</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="stylesheet" href="{% static 'css/app.css' %}">
  <link rel="manifest" href="{% static 'manifest.webmanifest' %}">
  <meta name="theme-color" content="#0d1526">
  <link rel="icon" type="image/png" href="{% static 'icons/favicon.png' %}">
  <link rel="apple-touch-icon" href="{% static 'icons/apple-touch-icon.png' %}">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="{{ club_short }}">
  <meta name="mobile-web-app-capable" content="yes">
</head>
<body class="auth-body">
{% include "includes/sprite.html" %}
<div class="loading-bar" data-loading-bar aria-hidden="true"></div>

<div class="auth-shell">
  <div class="auth-card">
    {% block card %}{% endblock %}
  </div>
</div>

<div class="toast-stack" data-toast-stack aria-live="polite"></div>
<script src="{% static 'js/app.js' %}" defer></script>
</body>
</html>
