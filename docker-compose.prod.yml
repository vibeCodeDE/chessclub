# Produktivbetrieb: App + PostgreSQL + Caddy TLS-Proxy + nächtliches verschlüsseltes Backup (PRD N1.1, N2.1, N2.4 / ADR-009 / T24)
#
# Start:  docker compose -f docker-compose.prod.yml up -d --build
# Wichtig: Vor dem ersten Start .env.prod anlegen (siehe docs/deployment.md).

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: [.env.prod]
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-schachverein}"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    env_file: [.env.prod]
    environment:
      POSTGRES_HOST: db
      DJANGO_SETTINGS_MODULE: "config.production"   # erzwingt Secret-Key und echtes Mail-Backend
      DJANGO_DEBUG: "0"
      TWOFA_PFLICHT: "1"
      PWA_AKTIV: "${PWA_AKTIV:-0}"
      SECURE_SSL_REDIRECT: "${SECURE_SSL_REDIRECT:-1}"        # im Reverse Proxy auf 1 setzen, sobald TLS aktiv ist
      SECURE_HSTS_SECONDS: "${SECURE_HSTS_SECONDS:-31536000}" # nach erfolgreichem TLS-Test z. B. auf 31536000 setzen
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 60"
    volumes:
      - static_files:/app/staticfiles

  # TLS Reverse Proxy (Caddy, ADR-009)
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - static_files:/app/staticfiles:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

  # Nächtliches verschlüsseltes Datenbank-Backup mit 30-Tage-Aufbewahrung (PRD N2.1 / ADR-009)
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: [.env.prod]
    environment:
      POSTGRES_HOST: db
      KUMA_PUSH_URL: ${KUMA_PUSH_URL:-}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backups:/backups
      - ./tools:/tools:ro
    entrypoint: ["/bin/sh", "-c"]
    command: >
      "apk add --no-cache openssl curl >/dev/null 2>&1 || true;
       while true; do
         /tools/backup.sh;
         sleep 86400;
       done"

  # Monitoring mit Uptime Kuma (PRD N2.8 / ADR-009 / T24b)
  uptime-kuma:
    image: louislam/uptime-kuma:1-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3001"
    volumes:
      - kuma_data:/app/data
    depends_on:
      - app

volumes:
  db_data:
  static_files:
  caddy_data:
  caddy_config:
  kuma_data:
