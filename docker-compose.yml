services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: schachverein
      POSTGRES_USER: schachverein
      POSTGRES_PASSWORD: schachverein
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U schachverein -d schachverein"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    ports:
      - "8000:8000"
    environment:
      POSTGRES_HOST: db
      DJANGO_DEBUG: "1"
      DJANGO_SECRET_KEY: dev-only-secret-key
      # Entwicklung ohne Zwei-Faktor, wie in der README beschrieben. Der
      # Produktivbetrieb setzt TWOFA_PFLICHT=1 (docker-compose.prod.yml).
      TWOFA_PFLICHT: "0"
      # PWA temporär deaktiviert (1 = an, 0 = aus)
      PWA_AKTIV: "0"
      # Nur Entwicklung: fester Schluessel, damit Mandatsdaten in der Dev-Datenbank
      # gelesen werden koennen. Im Betrieb gehoert der Schluessel nach .env.prod
      # (siehe .env.prod.example) – dieser Wert niemals produktiv verwenden.
      IBAN_FERNET_KEY: "up3_XszoFQiTs6TmInARNOIqBlEeh7V_7e46vfQ_g-E="
      # Vereinsprofil der oeffentlichen Seiten – Demo-Werte passend zu `seed_demo`.
      # Fuer den echten Verein in .env.prod pflegen (siehe README, ADR-012).
      CLUB_FOUNDED: "1924"
      CLUB_LOCATION: "Musterstadt"
      CLUB_ROOM: "Vereinsheim Musterstadt"
      CLUB_NIGHT_HOURS: "Donnerstags ab 19:00 Uhr"
      CLUB_YOUTH_HOURS: "Donnerstags 17:30 – 19:00 Uhr"
      CLUB_DESCRIPTION: "Schach für alle – vom ersten Bauernzug bis zur Ligapartie."
      # DSB-Schnittstelle (ADR-016 / K3.6)
      DSB_VKZ: "61313"
      DSB_API_TOKEN: "adae738aedc07673efababb154b4e36595a2198c"
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
