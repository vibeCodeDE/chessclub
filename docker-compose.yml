services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: schachverein
      POSTGRES_USER: schachverein
      POSTGRES_PASSWORD: schachverein
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U schachverein -d schachverein"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      POSTGRES_HOST: db
      DJANGO_DEBUG: "1"
      DJANGO_SECRET_KEY: dev-only-secret-key
      # Nur Entwicklung: fester Schluessel, damit Mandatsdaten in der Dev-Datenbank
      # gelesen werden koennen. Im Betrieb gehoert der Schluessel nach .env.prod
      # (siehe .env.prod.example) – dieser Wert niemals produktiv verwenden.
      IBAN_FERNET_KEY: "up3_XszoFQiTs6TmInARNOIqBlEeh7V_7e46vfQ_g-E="
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
