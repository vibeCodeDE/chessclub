{% load static %}
<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Schachverein{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'css/app.css' %}">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="/">♔ Schachverein</a>
    <details class="nav-toggle">
      <summary aria-label="Menü öffnen">☰</summary>
      <nav>
        <a href="/">Startseite</a>
        <a href="/admin/">Anmelden</a>
      </nav>
    </details>
  </header>
  <main class="container">
    {% block content %}{% endblock %}
  </main>
  <footer class="site-footer">
    <p>Schachvereins-Software</p>
  </footer>
  <script>
    document.querySelectorAll(".nav-toggle").forEach(function (details) {
      var mq = window.matchMedia("(min-width: 48rem)");
      var sync = function () { details.open = mq.matches; };
      sync();
      mq.addEventListener("change", sync);
    });
  </script>
</body>
</html>
