<div class="season-filter" style="display:inline-flex;align-items:center;gap:0.5rem">
  <label for="filter_saison" style="font-weight:600;font-size:0.875rem;margin:0;display:inline-flex;align-items:center;gap:0.35rem">
    <svg class="icon icon-sm" aria-hidden="true" style="width:16px;height:16px"><use href="#i-calendar"></use></svg>
    <span>Saison:</span>
  </label>
  <select id="filter_saison" name="saison" onchange="this.form ? this.form.submit() : (window.location.search = '?saison=' + this.value)" style="padding:0.3rem 0.6rem;font-size:0.875rem;border:1px solid var(--border);border-radius:var(--radius-sm, 4px);background:var(--surface);color:var(--text)">
    {% for s in alle_saisons %}
      <option value="{{ s.pk }}" {% if gewaehlte_saison and gewaehlte_saison.pk == s.pk %}selected{% endif %}>
        {{ s.name }}{% if s.ist_aktiv %} (Aktuell){% elif s.ist_archiviert %} (Archiv){% endif %}
      </option>
    {% endfor %}
  </select>
  {% if gewaehlte_saison and gewaehlte_saison.ist_archiviert %}
    <span class="badge" style="background:var(--muted-bg);color:var(--muted);font-size:0.75rem" title="Diese Saison ist archiviert und schreibgeschützt">
      Archiv
    </span>
  {% endif %}
</div>
